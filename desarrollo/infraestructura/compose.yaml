
services:
  postgres:
    image: postgres:17
    container_name: chambitas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: chambitas_db
      POSTGRES_USER: chambitas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - chambitas_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chambitas_user -d chambitas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chambitas_pgdata:
